[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "spotifi"
version = "0.1.0"
description = "Spotify controls, Spicetify extensions, and a native macOS companion"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
spotifi = "spotifi.cli:entrypoint"

[project.optional-dependencies]
dev = ["ruff>=0.11,<1", "build>=1.2,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/spotifi"]

[tool.hatch.build.targets.wheel.force-include]
"src/spicetify" = "spotifi/resources/src/spicetify"
"src/streamdeck" = "spotifi/resources/src/streamdeck"
"src/mini-player.swift" = "spotifi/resources/src/mini-player.swift"
"conf" = "spotifi/resources/conf"

[tool.hatch.build.targets.sdist]
include = ["/src", "/conf", "/tests", "/assets", "/bin", "/justfile", "/README.md", "/LICENSE", "/pyproject.toml"]
exclude = ["**/logs/**", "**/__pycache__/**"]

[tool.ruff]
target-version = "py39"
line-length = 100
include = ["*.py", "bin/spotifi"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
